[package]
name = "api-ws-demo"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "api-ws-demo"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
rand = "0.10"
tower_governor = { version = "0.5", features = ["axum"] }
governor = "0.8"
# 仅用 ServiceExt::oneshot 做限流绕过分流；已是传递依赖，不新增 crate。
tower = { version = "0.5", default-features = false, features = ["util"] }
# 仅 netem 的 TLS 上游使用；线上镜像用 --no-default-features 构建，不带这几项。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[features]
default = ["tls"]
# netem 的 https 上游支持（rustls + webpki 根证书）。
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
